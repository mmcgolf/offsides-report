name: Update Odds Data

on:
  schedule:
    # Run twice daily: 8 AM and 5 PM Eastern (12:00 and 21:00 UTC)
    - cron: '0 12 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual triggers from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate site data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/generate_site.py --live

      - name: Check for changes
        id: check
        run: |
          git diff --quiet docs/data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Offsides Bot"
          git config user.email "bot@offsides-report.github.io"
          git add docs/data/
          git commit -m "Update odds data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
